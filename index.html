<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Orcinus AI | API文档</title>
  <link rel="icon" href="/favicon.png" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 代码高亮夜间主题 -->
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/tomorrow-night-bright.min.css"> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tomorrow-night-bright.min.css">
  <!-- 行号插件样式 -->
  <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/plugins/line-numbers/line-numbers.min.css"> -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/plugins/line-numbers/line-numbers.min.css">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <!-- 顶部吸顶导航 -->
  <header class="top-nav">
    <div class="nav-inner">
      <!-- 导航栏左侧 -->
      <div class="nav-left">
        <button class="hamburger" id="sidebarToggle">☰</button>
        <a href="/" class="logo">
          <img src="/favicon.png" width="36" height="36" alt="Orcinus AI">
          <span>ORCINUS AI</span>
        </a>
      </div>
      <!-- 导航栏中间 -->
      <div class="nav-center">
        <div class="search-wrap">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="搜索文档...">
          <div class="search-results" id="searchResults"></div>
        </div>
      </div>
      <!-- 导航栏右侧 -->
      <div class="nav-right">
        <a href="/community.html" class="nav-link">社区</a>
        <a href="/about.html" class="nav-link">关于</a>
        <button class="theme-btn" id="themeToggle">夜间</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧目录（自动从_sidebar.md加载） -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>
    <!-- 中间正文 -->
    <main class="content" id="content">
      <article class="markdown-body" id="markdownBody"></article>
      <footer class="footer">Copyright © 2016-<span id="year"></span> ORCINUS AI. All Rights Reserved.</footer>
    </main>
    <!-- 右侧锚点栏目录 -->
    <aside class="toc" id="toc">
      <div class="toc-title">目录</div>
      <div class="toc-list" id="tocList"></div>
    </aside>
  </div>

  <!-- 右下角按钮 -->
  <div class="fab-group">
    <button class="fab-btn" id="backTop" title="回到顶部">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"></line>
        <polyline points="5 12 12 5 19 12"></polyline>
      </svg>
    </button>
    <button class="fab-btn" id="feedbackBtn" title="反馈">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>
  </div>

  <!-- 反馈浮层 -->
  <div class="feedback-popover" id="feedbackPopover">
    <div class="popover-content">
      <h4>意见反馈</h4>
      <div class="form-group">
        <!--字符数 ≤ 64-->
        <input type="text" id="feedbackName" placeholder="您的称呼" maxlength="64">
        <span class="form-error" style="display:none; color:#ef4444; font-size:12px; margin-top:4px;">请填写此字段❗</span>
      </div>
      <div class="form-group">
        <!--字符数 ≤ 800-->
        <textarea id="feedbackMsg" rows="3" placeholder="请描述您的问题或建议" maxlength="800"></textarea>
        <span class="form-error" style="display:none; color:#ef4444; font-size:12px; margin-top:4px;">请填写此字段❗</span>
      </div>
      <button class="btn btn-primary w-full" id="submitFeedback">提交反馈</button>
    </div>
  </div>

  <!-- 依赖CDN：marked渲染md + highlight代码高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
  <!-- 行号插件 -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/plugins/line-numbers/line-numbers.min.js"></script> -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/plugins/line-numbers/line-numbers.min.js"></script>
  <script src="./assets/js/main.js"></script>
</body>
</html>
